name: Auto Update CFO Market & MOEX Futures

on:
  schedule:
    - cron: '0 7,12,16 * * 1-5'  # Автозапуск по будням в 10:00, 15:00 и 19:00 МСК
  workflow_dispatch:            # Возможность запускать вручную в любой момент

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install libraries
        run: pip install requests pandas yfinance

      - name: Run data fetcher
        run: python update_data.py

      - name: Commit updated CSV files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add cfo_vacancies.csv moex_futures.csv
          git commit -m "Auto-update market and futures data" || exit 0
          git push
